name: Build Docker Image (Source)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build & push (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # setuptools-scm derives the version from git history/tags,
          # which requires a full clone (not a shallow fetch).
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af

      - name: Compute image name and tags
        id: meta
        run: |
          # Every main push produces the newest dev image: refresh latest
          # and keep a sha tag for traceability. The wheel takes the
          # git-derived version (e.g. 1.3.1.dev2+g<sha>) because
          # VLLM_VERSION_OVERRIDE is empty in Dockerfile.src.
          IMAGE="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.src
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          # Persist buildx layers in the GitHub Actions cache so reruns
          # skip the expensive source build stages.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
